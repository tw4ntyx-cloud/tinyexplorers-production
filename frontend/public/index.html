<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#FFF7EE" />

        <!-- Primary SEO -->
        <title>Tiny Explorers — Bermuda Early Childhood Center | Hamilton</title>
        <meta name="description" content="Tiny Explorers is Bermuda's premier early childhood center in Hamilton. A calm, Montessori-inspired preschool for ages 6 months – 8 years. Now enrolling for Fall 2026." />
        <meta name="author" content="Tiny Explorers Bermuda" />
        <meta name="keywords" content="Bermuda preschool, Hamilton daycare, Montessori Bermuda, early childhood education, infant care Bermuda, Tiny Explorers" />
        <link rel="canonical" href="https://tinyexplorersv3.vercel.app/" />

        <!-- Open Graph -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Tiny Explorers" />
        <meta property="og:title" content="Tiny Explorers — Bermuda Early Childhood Center" />
        <meta property="og:description" content="Where little minds grow through play, care, and confidence. A Montessori-inspired preschool in Hamilton, Bermuda." />
        <meta property="og:url" content="https://tinyexplorersv3.vercel.app/" />
        <meta property="og:image" content="https://images.unsplash.com/photo-1763310225230-6e15b125935a?crop=entropy&cs=srgb&fm=jpg&w=1200&h=630&fit=crop&q=85" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:locale" content="en_BM" />

        <!-- Twitter -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Tiny Explorers — Bermuda Early Childhood Center" />
        <meta name="twitter:description" content="Where little minds grow through play, care, and confidence. Now enrolling for Fall 2026." />
        <meta name="twitter:image" content="https://images.unsplash.com/photo-1763310225230-6e15b125935a?crop=entropy&cs=srgb&fm=jpg&w=1200&h=630&fit=crop&q=85" />

        <!-- Icons -->
        <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
        <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
        <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

        <!-- Fonts: preconnect first, then async stylesheet -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

        <!-- Image CDN preconnects — saves ~300ms on hero LCP -->
        <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
        <link rel="preconnect" href="https://images.pexels.com" crossorigin />

        <!-- Structured data: Preschool / LocalBusiness for local SEO -->
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "Preschool",
          "name": "Tiny Explorers",
          "image": "https://images.unsplash.com/photo-1763310225230-6e15b125935a?crop=entropy&cs=srgb&fm=jpg&w=1200&h=630&fit=crop&q=85",
          "description": "Bermuda-based early childhood center for ages 6 months to 8 years. Montessori and Reggio Emilia-inspired curriculum.",
          "url": "https://tinyexplorersv3.vercel.app/",
          "telephone": "+1-441-123-4567",
          "email": "hello@tinyexplorers.bm",
          "priceRange": "$$",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "12 Reid Street",
            "addressLocality": "Hamilton",
            "postalCode": "HM 11",
            "addressCountry": "BM"
          },
          "openingHoursSpecification": [
            {
              "@type": "OpeningHoursSpecification",
              "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday"],
              "opens": "07:30",
              "closes": "18:00"
            }
          ]
        }
        </script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
