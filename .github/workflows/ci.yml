name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[pages-preview]')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: CI=true npm run build

  backend:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[pages-preview]')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: development
      MONGO_URL: ""
      ADMIN_API_KEY: ci-test-admin-key
      REACT_APP_BACKEND_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install pytest requests
      - name: Start API server
        run: |
          nohup uvicorn server:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/api/health && break
            sleep 1
          done
      - run: pytest tests/test_api.py -v
      - name: Show server log on failure
        if: failure()
        run: cat server.log

  deploy_preview_pages:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[pages-preview]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build for project Pages path
        run: PUBLIC_URL=/tinyexplorers-production CI=true npm run build
      - name: Add SPA fallback
        run: cp build/index.html build/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build
      - id: deployment
        uses: actions/deploy-pages@v4
